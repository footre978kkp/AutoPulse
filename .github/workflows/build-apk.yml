name: Build AutoPulse APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Verify and unpack AutoPulse source
        shell: bash
        run: |
          cat source/part1.b64 source/part2.b64 source/part3.b64 | base64 --decode > autopulse.tar.xz
          xz -t autopulse.tar.xz
          tar -xJf autopulse.tar.xz
          cat patch23/p1.txt patch23/p2.txt patch23/p3.txt | base64 --decode > patch23.tar.xz
          xz -t patch23.tar.xz
          tar -xJf patch23.tar.xz
          echo 'New simple app version:'
          grep 'versionName' app/build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK without retired tools package
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Generate custom launcher art
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          from math import hypot
          S=512
          img=Image.new('RGB',(S,S))
          px=img.load()
          for y in range(S):
              for x in range(S):
                  g=max(0,1-hypot(x-300,y-185)/510)
                  px[x,y]=(int(8+8*g),int(16+22*g),int(35+38*g))
          dr=ImageDraw.Draw(img)
          dr.rounded_rectangle((18,18,494,494),radius=118,outline=(51,84,119),width=5)
          for i in range(7):
              rect=(96+i*23,98+i*21,401-i*20,423-i*13)
              if rect[0]>=rect[2] or rect[1]>=rect[3]: break
              dr.arc(rect,40,303,fill=(min(255,48+10*i),max(0,230-11*i),min(255,198+4*i)),width=max(7,15-i))
          dr.ellipse((345,69,460,184),fill=(14,36,62),outline=(93,227,209),width=9)
          dr.line((403,126,403,89),fill=(245,250,255),width=9)
          dr.line((403,126,435,146),fill=(245,250,255),width=9)
          dr.ellipse((395,118,411,134),fill=(245,250,255))
          for dpi,s in {'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}.items():
              dst=Path(f'app/src/main/res/mipmap-{dpi}/ic_launcher.png')
              dst.parent.mkdir(parents=True,exist_ok=True)
              img.resize((s,s),Image.Resampling.LANCZOS).save(dst)
          print('icons ready')
          PY

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoPulse-v2.3-Simple-HONOR-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
