name: Build AutoPulse APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Verify and unpack AutoPulse source
        shell: bash
        run: |
          cat transfer/part-*.txt | base64 --decode > autopulse.tar.xz
          echo "85a9380436c87713d47b90f7eb4f18e8135934cb886bbade3ddb0e0b67239e53  autopulse.tar.xz" | sha256sum --check
          tar -xJf autopulse.tar.xz
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --list_installed | head -60

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android platform 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoPulse-HONOR-X9d-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
